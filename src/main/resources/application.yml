server:
  port: 8888

spring:
  application:
    name: config-server
  # Disable default Vault integration - we handle it manually
  cloud:
    config:
      server:
        composite: []  # Empty - our custom repository will be used instead

# Custom Vault configuration
vault:
  uri: ${VAULT_URI:http://localhost:8200}
  role-id: ${VAULT_ROLE_ID}
  secret-id: ${VAULT_SECRET_ID}

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,refresh,customVault
  endpoint:
    health:
      show-details: always
      show-components: always

# Logging
logging:
  level:
    com.example.vault: DEBUG
    org.springframework.cloud.config: INFO
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"