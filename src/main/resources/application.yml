server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        composite:
          - type: vault
            uri: ${VAULT_URI:http://localhost:8200}
            backend: secret
            default-key: application
            profile-separator: '/'
            order: 1
          - type: s3
            uri: ${S3_URI}
            bucket: ${S3_BUCKET}
            order: 2
        vault:
          authentication: TOKEN  # Use token instead of APPROLE
          token: ${spring.cloud.config.server.vault.token:}  # Will be set by our refresher
          uri: ${VAULT_URI:http://localhost:8200}

# Configuration for our token refresher
vault:
  uri: ${VAULT_URI:http://localhost:8200}
  app-role:
    role-id: ${VAULT_ROLE_ID}
    secret-id: ${VAULT_SECRET_ID}

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,refresh
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.example.vault: DEBUG
    org.springframework.cloud.config: INFO
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"