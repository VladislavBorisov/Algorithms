server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        composite:
          - type: vault
            uri: ${VAULT_URI:http://localhost:8200}
            backend: secret
            default-key: application
            profile-separator: '/'
            order: 1
            vault:
              authentication: APPROLE
              app-role:
                role-id: ${VAULT_ROLE_ID}
                secret-id: ${VAULT_SECRET_ID}
          - type: s3
            uri: ${S3_URI}
            bucket: ${S3_BUCKET}
            order: 2

# Enable refresh endpoint to handle token expiration
management:
  endpoints:
    web:
      exposure:
        include: health,refresh
  endpoint:
    refresh:
      enabled: true

# Logging
logging:
  level:
    org.springframework.cloud.config: INFO
  pattern:
    console: "%d{HH:mm:ss} - %msg%n"