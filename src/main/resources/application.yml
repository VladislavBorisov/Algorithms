server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        composite:
          - type: s3
            uri: ${S3_URI}
            bucket: ${S3_BUCKET}
            order: 2
        # Vault configuration - used by our custom VaultEnvironmentRepository
        vault:
          authentication: APPROLE
          app-role:
            role-id: ${VAULT_ROLE_ID}
            secret-id: ${VAULT_SECRET_ID}
          uri: ${VAULT_URI:http://localhost:8200}
          backend: secret
          default-key: application
          profile-separator: '/'

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,refresh
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.example.vault: DEBUG
    org.springframework.cloud.config: INFO
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"